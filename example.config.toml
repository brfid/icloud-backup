# Copy to ~/.config/icloud_backup/config.toml and edit.

# iCloud Drive archive destination.
dest_root = "~/Library/Mobile Documents/com~apple~CloudDocs/backups"

# Retention for every source. Values must be positive integers.
[retention]
daily = 7
weekly = 4
monthly = 12

[[source]]
name = "documents"
path = "~/Documents"
# Globs match file or directory names, not paths.
excludes = [".DS_Store"]

[[source]]
name = "code"
path = "~/src"
excludes = [".DS_Store", "__pycache__", "*.pyc", ".venv", "venv", "node_modules"]
