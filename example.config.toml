# TEMPLATE ONLY: the running installation never reads this file.
# Copy to a private config and edit its sources before a new installation.
# See docs/configuration.md for the schema and docs/operations.md for discovery.
# Keep real machine paths and source inventories out of Git.
dest_root = "~/Library/Mobile Documents/com~apple~CloudDocs/backups"

[retention]
daily = 14
weekly = 8
monthly = 24

# Optional; defaults suit an Apple Silicon Mac with Homebrew.
[runtime]
restic = "/opt/homebrew/bin/restic"
reserve_mib = 1024
timeout_hours = 6

[[source]]
name = "projects"
path = "~/src"
excludes = [".DS_Store", ".git", "*.git", "node_modules", "__pycache__", "*.pyc", ".venv"]

[[source]]
name = "documents"
path = "~/Documents/Example"
excludes = [".DS_Store", ".git", "*.git"]
# Set allow_empty = true only when an empty source is intentional.
